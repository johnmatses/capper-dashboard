<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whop Login ✅</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #0f0f0f; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .box { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 32px; max-width: 560px; width: 90%; text-align: center; }
        h2 { color: #00d4aa; margin-bottom: 8px; }
        .code-box { background: #0f0f0f; border: 1px solid #444; border-radius: 8px; padding: 16px; margin: 16px 0; font-family: monospace; font-size: 11px; word-break: break-all; text-align: left; }
        .ok { color: #00d4aa; }
        .err { color: #ff4444; }
        .btn { background: #00d4aa; color: #000; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 16px; }
        .url-box { background: #0f0f0f; border: 1px solid #555; border-radius: 8px; padding: 12px; margin: 12px 0; font-family: monospace; font-size: 10px; word-break: break-all; color: #aaa; text-align: left; }
    </style>
</head>
<body>
<div class="box">
    <h2>✅ Whop Callback</h2>
    <p>Full URL (debug):</p>
    <div class="url-box" id="fullUrl"></div>
    <p>Parametrar:</p>
    <div class="code-box" id="params"></div>
    <button class="btn" onclick="copyAll()">📋 Kopiera allt</button>
    <p style="color:#888;font-size:13px;margin-top:12px">Skicka skärmdump till AgentCapper</p>
</div>
<script>
    document.getElementById('fullUrl').textContent = window.location.href;
    
    const params = new URLSearchParams(window.location.search);
    let html = '';
    for (const [key, val] of params.entries()) {
        const cls = key === 'error' ? 'err' : 'ok';
        html += `<span class="${cls}">${key}</span>: ${val}\n`;
    }
    document.getElementById('params').innerHTML = html || '<span class="err">Inga parametrar i URL:en</span>';
    
    function copyAll() {
        navigator.clipboard.writeText(window.location.href);
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whop Login ✅</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #0f0f0f; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .box { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 32px; max-width: 500px; width: 90%; text-align: center; }
        h2 { color: #00d4aa; margin-bottom: 8px; }
        .code-box { background: #0f0f0f; border: 1px solid #444; border-radius: 8px; padding: 16px; margin: 16px 0; font-family: monospace; font-size: 12px; word-break: break-all; color: #00d4aa; }
        .btn { background: #00d4aa; color: #000; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 16px; }
        .btn:active { opacity: 0.8; }
        .status { margin-top: 16px; color: #888; font-size: 14px; }
    </style>
</head>
<body>
<div class="box">
    <h2>✅ Whop Login</h2>
    <p>Din authorization code:</p>
    <div class="code-box" id="codeBox">Hämtar...</div>
    <button class="btn" onclick="copyCode()">📋 Kopiera kod</button>
    <p class="status" id="status">Klistra in koden i Telegram till @AgentCapper_Bot</p>
</div>
<script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const error = params.get('error');
    
    if (code) {
        document.getElementById('codeBox').textContent = code;
        document.getElementById('status').textContent = 'Skicka denna kod till @AgentCapper_Bot i Telegram med kommandot: /whop_code ' + code;
    } else if (error) {
        document.getElementById('codeBox').textContent = 'FEL: ' + error;
        document.getElementById('codeBox').style.color = '#ff4444';
    } else {
        document.getElementById('codeBox').textContent = 'Ingen kod hittades i URL:en';
    }
    
    function copyCode() {
        navigator.clipboard.writeText(code || '').then(() => {
            document.getElementById('status').textContent = '✅ Kopierad! Klistra in i Telegram: /whop_code [klistra in]';
        });
    }
</script>
</body>
</html>
